        stroke="#9A3412" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.82"/>
  <text x="0" y="-7" text-anchor="middle" font-size="7.5" fill="#9A3412"
        font-weight="bold" letter-spacing="0.3">LAND SOLD · 1833</text>
  <text x="0" y="5" text-anchor="middle" font-size="7" fill="#9A3412"
        opacity="0.85" font-style="italic">To Charles White Peters</text>
  <text x="0" y="16" text-anchor="middle" font-size="7" fill="#9A3412"
        opacity="0.85" font-style="italic">$2,000 · Jacksonville founded</text>
  <line x1="-30" y1="-22" x2="-78" y2="-92" stroke="#9A3412" stroke-width="0.8"
